apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashcards-backend
  labels:
    app: flashcards-backend
spec:
  replicas: 1
  strategy:
    # The SQLite file lives on a ReadWriteOnce volume that only one pod can
    # mount at a time, so the old pod must terminate before the new one starts.
    type: Recreate
  selector:
    matchLabels:
      app: flashcards-backend
  template:
    metadata:
      labels:
        app: flashcards-backend
    spec:
      containers:
        - name: backend
          image: flashcards-backend
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: /data/flashcards.db
            - name: RETRY_DELAY_MINUTES
              value: "5"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flashcards-backend-data
