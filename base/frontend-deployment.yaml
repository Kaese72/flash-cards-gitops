apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashcards-frontend
  labels:
    app: flashcards-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flashcards-frontend
  template:
    metadata:
      labels:
        app: flashcards-frontend
    spec:
      containers:
        - name: frontend
          image: flashcards-frontend
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
