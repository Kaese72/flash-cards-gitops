apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flashcards
  annotations: {}
spec:
  ingressClassName: nginx
  rules:
    - host: flashcards.hallen.example.com # TODO: replace with the real hostname
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: flashcards-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flashcards-frontend
                port:
                  number: 80
